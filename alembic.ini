# A generic, single database configuration for the consolidated PostgreSQL database.

[alembic]
# path to migration scripts.
script_location = %(here)s/shared/database/migrations/postgres


# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

path_separator = os

# database URL (unused in env.py as it loads from DATABASE_URL env var)
sqlalchemy.url = postgresql://postgres:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
