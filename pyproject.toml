[project]
name = "midas-touch"
version = "0.1.0"
description = "AI-Augmented Asset Management & Investment Analytics Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core Data Utilities & Async
    "pandas>=3.0.3",
    "datasets>=4.8.5",
    "tqdm>=4.67.3",
    "requests>=2.32.3",
    "python-multipart>=0.0.32",
    "dotenv>=0.9.9",
    # Database & ORM (PostgreSQL + pgvector + Neo4j)
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    # shared/database/repositories/connection.py 등이 아직 psycopg2를 직접 쓴다.
    # psycopg3 통합 이전까지는 제거하면 uv sync 시 백엔드가 죽는다.
    "psycopg2-binary>=2.9.12",
    # FastAPI Web Framework & Server
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    # Auth (JWT 발급/검증 + 비밀번호 해시)
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    # LangGraph & LLM Orchestration
    "langgraph>=1.0.0",
    "langchain>=1.0",
    "langchain-openai>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "openai>=2.37.0",
    # Embedding & Fine-tuning
    "sentence-transformers>=5.5.1",
    "peft>=0.11.0",
    "pypdf>=4.2.0",
    "pymupdf>=1.27.2.3",
    # LlamaIndex & Neo4j Knowledge Graph
    "llama-index>=0.10.50",
    "llama-index-graph-stores-neo4j>=0.2.0",
    "llama-index-llms-openai>=0.1.0",
    "llama-index-embeddings-huggingface>=0.2.0",
    # Market Data & Web Search
    "yfinance>=0.2.54",
    "langchain-tavily>=0.2.0",
    "fear-and-greed>=0.4",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ipykernel>=7.2.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ruff 기본 프로파일을 사용하되, 아래 규칙은 전용 정리 패스 전까지 유예한다.
ignore = [
    "B008",  # FastAPI Depends()/Query() 기본인자 관용구 (오탐)
    # BLE001: broad except 자체는 유예(종류가 많음). 단, silent swallow는 전부 로깅 처리했고
    #         S110/S112(try-except-pass/continue)는 다시 켜서 무로그 삼킴을 강제 차단한다.
    "BLE001",
    # --- TODO(lint-cleanup): 소규모 잔여, 전용 패스에서 정리 ---
    "TRY401", "PYI034", "SIM117", "B026", "ASYNC230",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # 패키지 재노출(re-export) 관용구

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
